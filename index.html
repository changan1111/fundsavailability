<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funds Availability — v5.9.2 Final</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b2a; --blue:#1d4ed8; --blue-l:#dbeafe; --blue-ll:#eff6ff;
  --teal:#0f766e; --teal-l:#ccfbf1; --amber:#b45309; --amber-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2; --slate1:#f8fafc; --slate2:#f1f5f9;
  --slate3:#e2e8f0; --slate4:#cbd5e1; --slate5:#94a3b8; --slate6:#64748b;
  --white:#fff; --shadow:0 4px 16px rgba(13,27,42,.06); --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f4fb;color:var(--ink);min-height:100vh}

.hdr{background:var(--ink);padding:18px 30px;display:flex;align-items:center;gap:15px;color:#fff}
.hdr-icon{font-size:1.5rem;background:linear-gradient(135deg,#1d4ed8,#0f766e);padding:8px;border-radius:10px}
.hdr-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem}

.wrap{max-width:1440px;margin:0 auto;padding:20px;display:grid;grid-template-columns:420px 1fr;gap:20px}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.sticky-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:15px}

.panel{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--slate3)}
.panel-hd{padding:12px 18px;border-bottom:1px solid var(--slate3);display:flex;align-items:center;gap:10px;background:var(--slate1)}
.panel-hd h3{font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;color:var(--ink)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.62rem;font-weight:800;color:var(--slate6);text-transform:uppercase;letter-spacing:.05em}
.field input, .field select{padding:8px;border:1.5px solid var(--slate3);border-radius:8px;font-size:.85rem;outline:none;background:var(--slate1);font-family:'Inter'}

/* Bucket Config Table */
.bkt-table{width:100%;border-collapse:collapse;font-size:.68rem}
.bkt-table th{padding:6px;background:var(--slate2);font-weight:700;border-bottom:2px solid var(--slate3)}
.bkt-table td{padding:5px 2px;text-align:center;border-bottom:1px solid var(--slate2)}
.bkt-inp{width:34px;text-align:center;padding:3px;border:1px solid var(--slate3);border-radius:4px;font-family:'JetBrains Mono'}

/* TRANSACTION ROW - FIXED 3 COLUMN VISIBILITY */
.dep-header{display:grid;grid-template-columns:25px 95px 1fr 75px 25px;gap:10px;padding:0 10px 8px;font-size:.6rem;font-weight:800;color:var(--slate5);text-transform:uppercase}
.rows-wrap{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding-right:4px}
.dep-row{background:var(--white);border-radius:10px;border:1.5px solid var(--slate3);overflow:hidden}
.dep-row-top{display:grid;grid-template-columns:25px 95px 1fr 75px 25px;gap:10px;padding:10px;align-items:center}
.row-num{font-family:'JetBrains Mono';font-size:.7rem;color:var(--slate5);font-weight:700}

.dep-ref{width:95px !important; font-family:'JetBrains Mono'; font-size:.75rem !important; padding:6px !important}
.dep-amt-wrap{position:relative; min-width:80px}
.dep-amt-wrap span{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--slate5);font-weight:600}
.dep-amt{padding-left:16px !important; width:100%; font-family:'JetBrains Mono' !important; font-weight:700 !important; color:var(--blue) !important; background:var(--blue-ll) !important; border-color:var(--blue-l) !important; font-size:.8rem !important}
.dep-bkt{width:75px !important; font-weight:700; cursor:pointer; font-size:.75rem !important; padding:6px !important}

.dep-row-bot{padding:0 10px 8px 45px;display:flex;gap:6px}
.tag{font-size:.55rem;font-weight:800;padding:2px 5px;border-radius:4px;text-transform:uppercase}
.tag-nd{background:var(--amber-l);color:var(--amber)}
.tag-excl{background:var(--red-l);color:var(--red)}

/* Results UI */
.tabs-bar{display:flex;gap:5px;margin-bottom:15px;background:var(--slate2);padding:5px;border-radius:10px;width:fit-content}
.tab-btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:.75rem;font-family:'Syne';color:var(--slate6);background:transparent}
.tab-btn.active{background:var(--ink);color:#fff}
.tab-btn.active.nw-mode{background:var(--teal)}

.day-summary{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
.ds-box{background:#fff;border:1px solid var(--slate3);border-radius:8px;min-width:95px;flex:1;text-align:center}
.ds-day{background:var(--slate1);font-size:.6rem;font-weight:800;padding:5px;border-bottom:1px solid var(--slate3)}
.ds-amt{padding:10px;font-family:'JetBrains Mono';font-weight:700;font-size:.85rem}

table.dg{width:100%;border-collapse:collapse;font-size:.75rem}
table.dg th{padding:10px;background:var(--slate1);border-bottom:2px solid var(--slate3);text-transform:uppercase;font-size:.6rem;letter-spacing:.05em}
table.dg td{padding:12px 10px;border-bottom:1px solid var(--slate2);text-align:center}
.cell-val{font-family:'JetBrains Mono';font-weight:700;font-size:.8rem}
.cell-tag{font-size:.5rem;font-weight:800;padding:2px 4px;border-radius:4px;display:inline-block;margin-top:4px}

.btn-main{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-family:'Syne';margin-top:10px;transition:0.2s}
.btn-main:hover{background:var(--blue);transform:translateY(-1px)}
.del-btn{background:none;border:none;cursor:pointer;color:var(--slate4);font-size:1rem;display:flex;justify-content:center}
.del-btn:hover{color:var(--red)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">🏛️</div>
  <div class="hdr-title">Funds Availability Calculator</div>
</div>

<div class="wrap">
  <div class="sticky-side">
    <div class="panel">
      <div class="panel-hd"><h3>⚙️ Global Configuration</h3></div>
      <div class="panel-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
          <div class="field"><label>Release Cap ($)</label><input type="number" id="cfgMax" value="6725"></div>
          <div class="field"><label>ND Min ($)</label><input type="number" id="cfgNdMin" value="275"></div>
        </div>
        <div class="field"><label>Environment Mode</label>
          <select id="acctType" onchange="renderBucketTable(); renderRows();">
            <option value="both">Compare View</option>
            <option value="existing">Existing Only</option>
            <option value="new">New Account Only</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-hd"><h3>🎯 Bucket Logic</h3></div>
      <div class="panel-body" id="bucketTableWrap"></div>
    </div>

    <div class="panel">
      <div class="panel-hd"><h3>📋 Transactions</h3></div>
      <div class="panel-body">
        <div class="dep-header"><span>#</span><span>Ref ID</span><span>Amount</span><span>Bkt</span><span></span></div>
        <div id="rowsWrap" class="rows-wrap"></div>
        <button class="btn-main" style="background:var(--slate2);color:var(--ink);font-size:.7rem;padding:8px" onclick="addRow()">＋ Add Deposit Row</button>
        <button class="btn-main" onclick="calculate()">▶ Process Results</button>
      </div>
    </div>
  </div>

  <div id="outPanel" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-ex" onclick="showTab('ex')">Existing Account</button>
      <button class="tab-btn" id="tab-nw" onclick="showTab('nw')">New Account</button>
    </div>

    <div id="pane-ex" class="panel">
      <div class="panel-hd" style="background:var(--ink)"><h3 style="color:#fff">Schedule: Existing</h3></div>
      <div class="panel-body">
        <div class="day-summary" id="ex-summary"></div>
        <table class="dg" id="ex-table"><thead></thead><tbody></tbody></table>
      </div>
    </div>

    <div id="pane-nw" class="panel" style="display:none">
      <div class="panel-hd" style="background:var(--teal)"><h3 style="color:#fff">Schedule: New</h3></div>
      <div class="panel-body">
        <div class="day-summary" id="nw-summary"></div>
        <table class="dg" id="nw-table"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
let rows = [];
let nextUniqueId = 1;
const BUCKETS = [2,3,4,5,6,7];
const bucketCfg = {
    2:{pri:1, def:1, ext:6, t1:0, t2:6, nd:false, excl:false},
    3:{pri:4, def:4, ext:3, t1:2, t2:3, nd:false, excl:false},
    4:{pri:5, def:2, ext:5, t1:0, t2:5, nd:false, excl:false},
    5:{pri:2, def:1, ext:1, t1:5, t2:6, nd:true,  excl:false},
    6:{pri:3, def:2, ext:5, t1:3, t2:5, nd:false, excl:true },
    7:{pri:6, def:3, ext:5, t1:0, t2:5, nd:false, excl:false}
};

function renderBucketTable() {
    const type = document.getElementById('acctType').value;
    let html = `<table class="bkt-table"><thead><tr><th>Bkt</th><th>Pri</th><th>Def</th>`;
    if(type !== 'new') html += `<th>Ext</th><th>ND</th>`;
    if(type !== 'existing') html += `<th>T1</th><th>T2</th><th>Exc</th>`;
    html += `</tr></thead><tbody>`;
    BUCKETS.forEach(b => {
        const c = bucketCfg[b];
        html += `<tr><td><b>B${b}</b></td>
            <td><input class="bkt-inp" type="number" value="${c.pri}" onchange="bucketCfg[${b}].pri=parseInt(this.value)"></td>
            <td><input class="bkt-inp" type="number" value="${c.def}" onchange="bucketCfg[${b}].def=parseInt(this.value)"></td>`;
        if(type !== 'new') html += `
            <td><input class="bkt-inp" type="number" value="${c.ext}" onchange="bucketCfg[${b}].ext=parseInt(this.value)"></td>
            <td><input type="checkbox" ${c.nd?'checked':''} onchange="bucketCfg[${b}].nd=this.checked; renderRows();"></td>`;
        if(type !== 'existing') html += `
            <td><input class="bkt-inp" type="number" value="${c.t1}" onchange="bucketCfg[${b}].t1=parseInt(this.value)"></td>
            <td><input class="bkt-inp" type="number" value="${c.t2}" onchange="bucketCfg[${b}].t2=parseInt(this.value)"></td>
            <td><input type="checkbox" ${c.excl?'checked':''} onchange="bucketCfg[${b}].excl=this.checked; renderRows();"></td>`;
        html += `</tr>`;
    });
    document.getElementById('bucketTableWrap').innerHTML = html + `</tbody></table>`;
}

function addRow() {
    rows.push({id: Date.now(), ref: 'CK' + String(nextUniqueId).padStart(4,'0'), amt: 0, bkt: 2});
    nextUniqueId++;
    renderRows();
}

function updateRow(idx, field, val) {
    if(field === 'amt') rows[idx].amt = parseFloat(val) || 0;
    else if(field === 'ref') rows[idx].ref = val;
    else if(field === 'bkt') rows[idx].bkt = parseInt(val);
}

function renderRows() {
    const type = document.getElementById('acctType').value;
    document.getElementById('rowsWrap').innerHTML = rows.map((r,i) => {
        const c = bucketCfg[r.bkt];
        let tags = '';
        if(type !== 'new' && c.nd) tags += `<span class="tag tag-nd">⚡ ND</span>`;
        if(type !== 'existing' && c.excl) tags += `<span class="tag tag-excl">Exclusion</span>`;
        
        return `
        <div class="dep-row">
            <div class="dep-row-top">
                <span class="row-num">${i+1}</span>
                <input type="text" class="field dep-ref" value="${r.ref}" onchange="updateRow(${i},'ref',this.value)">
                <div class="dep-amt-wrap">
                    <span>$</span>
                    <input type="number" class="field dep-amt" value="${r.amt||''}" placeholder="0.00" onchange="updateRow(${i},'amt',this.value)">
                </div>
                <select class="field dep-bkt" onchange="updateRow(${i},'bkt',this.value); renderRows();">
                    ${BUCKETS.map(b => `<option value="${b}" ${r.bkt==b?'selected':''}>B${b}</option>`).join('')}
                </select>
                <button class="del-btn" onclick="rows.splice(${i},1);renderRows()">✕</button>
            </div>
            ${tags ? `<div class="dep-row-bot">${tags}</div>` : ''}
        </div>`;
    }).join('');
}

function calculate() {
    const sorted = [...rows].filter(r => r.amt > 0).sort((a,b) => bucketCfg[a.bkt].pri - bucketCfg[b.bkt].pri);
    if(sorted.length === 0) return;
    renderResults(sorted, 'ex');
    renderResults(sorted, 'nw');
    document.getElementById('outPanel').style.display = 'block';
}

function renderResults(data, mode) {
    const cap = parseFloat(document.getElementById('cfgMax').value);
    const ndMin = parseFloat(document.getElementById('cfgNdMin').value);
    let rem = cap, ndDone = false, totals = {};
    
    const processed = data.map(r => {
        const c = bucketCfg[r.bkt], s = [];
        let rAmt = r.amt;

        if(mode === 'ex') {
            if(c.nd && !ndDone && rem > 0) {
                let release = Math.min(ndMin, rAmt, rem);
                s.push({d: 1, amt: release, tag: '⚡ ND'});
                rAmt -= release; rem -= release; ndDone = true;
            }
            let defRel = Math.min(rAmt, rem);
            if(defRel > 0) { s.push({d: c.def, amt: defRel, tag: 'DEFAULT'}); rAmt -= defRel; rem -= defRel; }
            if(rAmt > 0) s.push({d: c.def + c.ext, amt: rAmt, tag: 'EXT'});
        } else {
            if(c.excl) s.push({d: c.def + c.t2, amt: rAmt, tag: 'EXCL'});
            else {
                let t1Rel = Math.min(rAmt, rem);
                if(t1Rel > 0) { s.push({d: c.def + c.t1, amt: t1Rel, tag: 'TIER 1'}); rAmt -= t1Rel; rem -= t1Rel; }
                if(rAmt > 0) s.push({d: c.def + c.t2, amt: rAmt, tag: 'TIER 2'});
            }
        }
        s.forEach(e => totals[e.d] = (totals[e.d] || 0) + e.amt);
        return { ref: r.ref, bkt: r.bkt, s };
    });

    const days = [...new Set(processed.flatMap(p => p.s.map(x => x.d)))].sort((a,b)=>a-b);
    const table = document.getElementById(mode+'-table');
    table.querySelector('thead').innerHTML = `<tr><th>Ref ID</th>${days.map(d=>`<th>Day ${d}</th>`).join('')}</tr>`;
    table.querySelector('tbody').innerHTML = processed.map(p => `
        <tr><td><b>${p.ref}</b><br><small>B${p.bkt}</small></td>
        ${days.map(d => {
            const e = p.s.find(x => x.d === d);
            const tagCls = e?.tag.includes('ND') ? 'tag-nd' : e?.tag.includes('TIER 1') ? 'tag-t1' : e?.tag === 'EXCL' ? 'tag-excl' : 'tag-ext';
            return e ? `<td><div class="cell-val">$${e.amt.toLocaleString()}</div><div class="cell-tag ${tagCls}">${e.tag}</div></td>` : `<td>—</td>`;
        }).join('')}</tr>`).join('');

    document.getElementById(mode+'-summary').innerHTML = days.map(d => `
        <div class="ds-box"><div class="ds-day">DAY ${d}</div><div class="ds-amt">$${totals[d].toLocaleString()}</div></div>`).join('');
}

function showTab(t) {
    document.getElementById('pane-ex').style.display = t === 'ex' ? 'block' : 'none';
    document.getElementById('pane-nw').style.display = t === 'nw' ? 'block' : 'none';
    document.getElementById('tab-ex').className = 'tab-btn' + (t === 'ex' ? ' active' : '');
    document.getElementById('tab-nw').className = 'tab-btn' + (t === 'nw' ? ' active nw-mode' : '');
}

renderBucketTable();
addRow();
</script>
</body>
</html>
